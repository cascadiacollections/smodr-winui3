name: Portable radio SDK
on:
  push:
    branches: [main, master, develop]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Test Docker availability and safe build commands
        shell: pwsh
        run: ./scripts/Test-LocalDockerHarness.ps1
      - name: Test headless Linux validation plans
        if: runner.os == 'Linux'
        run: bash scripts/test-portable-plan.sh
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore and audit portable libraries and tests
        working-directory: Cascadia.Radio.Tests
        shell: pwsh
        run: dotnet restore --locked-mode -p:NuGetAudit=true -p:NuGetAuditMode=all "-p:WarningsAsErrors=NU1901;NU1902;NU1903;NU1904"
      - name: Test stable runtime without Windows SDK
        working-directory: Cascadia.Radio.Tests
        run: dotnet test -c Release --no-restore -warnaserror --logger trx --results-directory ../out/radio-sdk-tests
      - name: Gate Roslyn analysis and test SARIF verdicts
        shell: pwsh
        run: |
          ./scripts/Test-StaticAnalysisHarness.ps1
          ./scripts/Test-StaticAnalysis.ps1
      - name: Check portable formatting
        working-directory: Cascadia.Radio.Tests
        run: dotnet format --no-restore --verify-no-changes --verbosity quiet
      - name: Validate packages and offline package consumer
        shell: pwsh
        run: |
          ./scripts/Test-RadioPackages.ps1
          ./scripts/Test-RadioApiCompatibility.ps1
      - name: Publish and execute trimmed SDK consumer
        if: runner.os == 'Linux'
        working-directory: samples/RadioBrowser.TrimConsumer
        run: |
          dotnet restore -r linux-x64 --source ../../out/radio-packages --source https://www.nuget.org/api/v2/
          dotnet publish -c Release -r linux-x64 --self-contained --no-restore -o ../../out/trim-consumer -warnaserror
          ../../out/trim-consumer/RadioBrowser.TrimConsumer
      - name: Retain local package and test evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: radio-sdk-${{ runner.os }}
          path: |
            out/radio-packages
            out/radio-sdk-tests
            out/static-analysis
