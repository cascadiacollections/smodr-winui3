name: Build and Test

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

env:
  SOLUTION_PATH: 'smodr.slnx'
  CONFIGURATION: 'Release'

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read

    strategy:
      matrix:
        include:
          - platform: x64
            rid: win-x64
            runner: windows-latest
            architecture: x64
          - platform: ARM64
            rid: win-arm64
            runner: windows-11-vs2026-arm
            architecture: arm64

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json
        architecture: ${{ matrix.architecture }}

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v3
      with:
        msbuild-architecture: ${{ matrix.architecture }}

    - name: Cache NuGet packages
      uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ matrix.platform }}-${{ hashFiles('**/packages.lock.json') }}
        restore-keys: |
          ${{ runner.os }}-nuget-${{ matrix.platform }}-
          ${{ runner.os }}-nuget-

    - name: Validate Visual Studio solution configurations
      shell: pwsh
      run: ./scripts/Test-SolutionConfigurations.ps1 -SelfTest

    - name: Restore and audit project dependencies
      shell: pwsh
      run: dotnet restore ${{ env.SOLUTION_PATH }} -p:Platform=${{ matrix.platform }} --locked-mode -p:NuGetAudit=true -p:NuGetAuditMode=all "-p:WarningsAsErrors=NU1901;NU1902;NU1903;NU1904"

    - name: Verify generated software notices and test inventory tooling
      shell: pwsh
      run: |
        ./scripts/Update-LicenseInventory.ps1 -Check
        ./scripts/Test-LicenseInventory.ps1

    - name: Build solution
      shell: pwsh
      run: ./scripts/Test-StaticAnalysis.ps1 -Scope Windows -Platform ${{ matrix.platform }}

    - name: Run tests
      run: dotnet test ${{ env.SOLUTION_PATH }} --configuration ${{ env.CONFIGURATION }} --no-build --no-restore -p:Platform=${{ matrix.platform }} --logger "trx;LogFileName=test-results.trx"

    - name: Repeat local synthetic stream transport tests
      shell: pwsh
      run: |
        foreach ($iteration in 1..3) {
          dotnet test ${{ env.SOLUTION_PATH }} --configuration ${{ env.CONFIGURATION }} --no-build --no-restore -p:Platform=${{ matrix.platform }} --filter "TestCategory=Loopback" --logger "trx;LogFileName=loopback-$iteration.trx"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        }

    - name: Run headless race and soak suite
      shell: pwsh
      run: ./scripts/Test-HeadlessSoak.ps1 -Platform ${{ matrix.platform }} -Minutes 1 -SkipBuild -OutputDirectory out/headless-soak/${{ matrix.platform }}

    - name: Record headless performance diagnostics
      shell: pwsh
      run: ./scripts/Measure-HeadlessPerformance.ps1 -Platform ${{ matrix.platform }} -Runs 3 -SkipBuild -OutputDirectory out/headless-performance/${{ matrix.platform }}

    - name: Upload headless confidence reports
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: headless-confidence-${{ matrix.platform }}
        path: |
          out/headless-soak/
          out/headless-performance/
          out/static-analysis/
        if-no-files-found: warn
        retention-days: 14

    - name: Publish self-contained app
      run: dotnet publish smodr/smodr.csproj --configuration ${{ env.CONFIGURATION }} --no-restore -p:Platform=${{ matrix.platform }} -r ${{ matrix.rid }} --self-contained true -o out/shoutkit-${{ matrix.platform }}

    - name: Verify published software notices
      shell: pwsh
      run: ./scripts/Test-LicenseInventory.ps1 -PublishedDirectory out/shoutkit-${{ matrix.platform }}

    - name: Download pinned Microsoft SBOM Tool
      if: matrix.platform == 'x64'
      shell: pwsh
      run: |
        $path = Join-Path $env:RUNNER_TEMP 'sbom-tool-win-x64.exe'
        Invoke-WebRequest 'https://github.com/microsoft/sbom-tool/releases/download/v4.1.5/sbom-tool-win-x64.exe' -OutFile $path
        $actual = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
        if ($actual -ne '625767b371b7fdd58f40f618b8a86da0247a33c89e419039c86b4edba1dad4b5') { throw "SBOM tool hash mismatch: $actual" }

    - name: Generate and validate SPDX SBOM
      if: matrix.platform == 'x64'
      shell: pwsh
      run: |
        ./scripts/Test-SbomHarness.ps1
        ./scripts/Generate-Sbom.ps1 -ToolPath "$env:RUNNER_TEMP/sbom-tool-win-x64.exe" -DropPath out/shoutkit-x64 -OutputDirectory out/sbom-x64 -PackageVersion '${{ github.run_number }}.0.0'
        Copy-Item -LiteralPath out/sbom-x64/_manifest -Destination out/shoutkit-x64/_manifest -Recurse

    - name: Validate unsigned MSIX packaging
      run: dotnet msbuild smodr/smodr.csproj -restore -p:RestoreLockedMode=true -p:Configuration=${{ env.CONFIGURATION }} -p:Platform=${{ matrix.platform }} -p:WindowsPackageType=MSIX -p:GenerateAppxPackageOnBuild=true -p:AppxPackageSigningEnabled=false -p:AppxBundle=Never -p:UapAppxPackageBuildMode=SideloadOnly -p:AppxPackageDir=out/msix-${{ matrix.platform }}/ -v:q

    - name: Verify packaged software notices
      shell: pwsh
      run: ./scripts/Test-LicenseInventory.ps1 -MsixDirectory out/msix-${{ matrix.platform }}

    - name: Install and upgrade disposable signed MSIX
      if: matrix.platform == 'ARM64'
      shell: powershell
      run: ./scripts/Test-MsixInstall.ps1 -Platform ARM64

    - name: Upload build artifacts
      if: success()
      uses: actions/upload-artifact@v7
      with:
        name: shoutkit-${{ matrix.platform }}-unsigned-preview
        path: out/shoutkit-${{ matrix.platform }}/
        retention-days: 7

  format-check:
    name: Check Code Formatting
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json

    - name: Restore dependencies
      run: dotnet restore ${{ env.SOLUTION_PATH }} --locked-mode

    - name: Check code formatting
      run: |
        dotnet format smodr.RadioCore/smodr.RadioCore.csproj --verify-no-changes --verbosity diagnostic
        dotnet format smodr.RadioSmoke/smodr.RadioSmoke.csproj --verify-no-changes --verbosity diagnostic
        dotnet format smodr.HeadlessPerf/smodr.HeadlessPerf.csproj --verify-no-changes --verbosity diagnostic
        dotnet format smodr/smodr.csproj --verify-no-changes --verbosity diagnostic
        dotnet format smodr.Tests/smodr.Tests.csproj --verify-no-changes --verbosity diagnostic
