name: Dev Container Validation

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - '.devcontainer/**'
      - '.github/workflows/devcontainer.yml'
      - 'global.json'
      - 'Directory.*.props'
      - 'nuget.config'
      - '.editorconfig'
      - 'portable/**'
      - 'Cascadia.Radio*/**'
      - 'smodr.Radio*/**'
      - 'smodr.Tests/**'
      - 'smodr/Services/LiveRadioRecovery.cs'
      - 'smodr/Services/PlaybackEnvironmentPolicy.cs'
      - 'samples/**'
      - 'scripts/validate-portable-radio.sh'
  pull_request:
    branches: [ main, master, develop ]
    paths:
      - '.devcontainer/**'
      - '.github/workflows/devcontainer.yml'
      - 'global.json'
      - 'Directory.*.props'
      - 'nuget.config'
      - '.editorconfig'
      - 'portable/**'
      - 'Cascadia.Radio*/**'
      - 'smodr.Radio*/**'
      - 'smodr.Tests/**'
      - 'smodr/Services/LiveRadioRecovery.cs'
      - 'smodr/Services/PlaybackEnvironmentPolicy.cs'
      - 'samples/**'
      - 'scripts/validate-portable-radio.sh'
  workflow_dispatch:

jobs:
  test:
    name: Test Dev Container
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    
    - name: Build and test dev container
      uses: devcontainers/ci@v0.3
      with:
        imageName: ghcr.io/${{ github.repository }}/devcontainer
        push: never
        runCmd: |
          bash scripts/validate-portable-radio.sh --include-compat
