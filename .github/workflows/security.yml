name: Security analysis

on:
  push:
    branches: [main, master, develop]
  pull_request:
  schedule:
    - cron: '31 12 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # CodeQL C# and Actions use the repository's configured default setup with
  # extended queries. A second advanced setup is rejected by code scanning.
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  policy-self-tests:
    name: Supply-chain policy self-tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - shell: pwsh
        run: |
          ./scripts/Test-SbomHarness.ps1
          ./scripts/Test-ReleaseEvidenceHarness.ps1
